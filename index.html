<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>香港樓盤地圖與大廈總覽</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
body{font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;margin:0;background:#f4f6f8}
#map{width:100%;height:56vh;border-bottom:3px solid #2f3640}
body.nomap #map{display:none}
.statline{padding:6px 12px;background:#2f3640;color:#fff;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;background:#353b48;align-items:center}
.toolbar button{cursor:pointer;padding:6px 16px;border:none;border-radius:4px;background:#576574;color:#fff;font-size:14px}
.toolbar button.active{background:#27ae60}
.toolbar button.fs{background:#e67e22}
.toolbar input{flex:1;min-width:200px;padding:6px 10px;border:none;border-radius:4px}
.hint{color:#dcdde1;font-size:12px}
.tablewrap{overflow:auto;max-height:75vh;margin:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
body.nomap .tablewrap{max-height:none;height:calc(100vh - 132px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#353b48;color:#fff;padding:8px 6px;cursor:pointer;white-space:nowrap;z-index:2}
th:hover{background:#57606f}
td{padding:6px;border-bottom:1px solid #ecf0f1;white-space:nowrap}
tbody tr:hover{background:#f1f2f6;cursor:pointer}
.star{color:#f39c12;font-size:15px}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;color:#fff;font-size:11px}
.t-red{background:#e74c3c}.t-green{background:#2ecc71}.t-blue{background:#3498db}.t-orange{background:#e67e22}
a{color:#0984e3;text-decoration:none}
#modalHost{position:fixed;inset:0;z-index:1000;display:none}
#modalHost.on{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:30px 10px}
.modal{position:relative;margin:0 auto;max-width:1050px;background:#fff;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal-head{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#353b48;color:#fff;border-radius:8px 8px 0 0;z-index:3}
.modal-head b{font-size:18px}
.closebtn{margin-left:auto;cursor:pointer;border:none;background:#e74c3c;color:#fff;border-radius:4px;padding:4px 12px;font-size:14px}
.modal-body{padding:14px 16px}
.mstats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.mstats span{background:#ecf0f1;border-radius:4px;padding:4px 10px;font-size:13px}
.mlinks{margin:8px 0 14px}
.mlinks a,.mlinks button{display:inline-block;margin:0 8px 6px 0;padding:5px 14px;border-radius:4px;border:none;cursor:pointer;font-size:13px}
.mlinks .btn-map{background:#0984e3;color:#fff}
.mlinks a{background:#dfe6e9;color:#2d3436}
.modal .tablewrap{margin:8px 0}
.modal th{background:#576574}
</style>
</head>

 document.getElementById('statline').innerHTML='顯示 '+rows.length+' 筆　|　金=收藏 紅=新盤 綠=減價 藍=加價 橙=無變動　|　產生時間：'+GENERATED;
}
/* ---- 全螢幕清單切換 ---- */
function toggleFS(){
 var b=document.body;
 b.classList.toggle('nomap');
 var btn=document.getElementById('btnFS');
 if(b.classList.contains('nomap')){
  btn.textContent='🗺 顯示地圖';
  try{var p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){});}catch(e){}
 }else{
  btn.textContent='🖥 全螢幕清單';
  try{if(document.exitFullscreen)document.exitFullscreen();}catch(e){}
  setTimeout(function(){map.invalidateSize();},150);
 }
}
/* ---- 大廈詳情彈窗 ---- */
function showDetail(bi){
 var b=BUILDINGS[bi];if(!b)return;
 var ls=[];
 for(var i=0;i<LISTINGS.length;i++){if(LISTINGS[i].building===b.name)ls.push({l:LISTINGS[i],i:i});}
 var h='<div class="modal-bg" onclick="if(event.target===this)closeDetail()"><div class="modal">';
 h+='<div class="modal-head"><b>'+esc(b.name)+'</b> '+(b.star?'<span class="star">★</span>':'')
  +'<span style="font-size:12px;color:#dcdde1">'+esc(b.district||'')+'</span>'
  +'<button class="closebtn" onclick="closeDetail()">✕ 關閉</button></div>';
 h+='<div class="modal-body">';
 h+='<div class="mstats">'
  +'<span>排名 #'+b.rank+'</span><span>放盤 '+b.count+' 個</span>'
  +'<span>樓齡 '+(b.age==null?'-':b.age)+' 年</span>'
  +'<span>售價 '+fmt(b.min_price)+' ~ '+fmt(b.max_price)+' 萬</span>'
  +'<span>平均售價 '+fmt(b.avg_price)+' 萬</span>'
  +'<span>平均呎價 '+fmt(b.avg_ft)+' 元</span>'
  +'<span>面積 '+fmt(b.min_area)+' ~ '+fmt(b.max_area)+' 呎</span>'
  +'<span>動態 <span class="tag '+tagClass(b.status)+'">'+esc(b.status)+'</span> '+esc(b.price_change||'')+'</span>'
  +'</div>';
 h+='<div class="mlinks"><button class="btn-map" onclick="showOnMap('+bi+')">📍 在地圖顯示</button>';
 if(b.google)h+='<a href="'+esc(b.google)+'" target="_blank">🔎 Google 凶宅查詢</a>';
 if(b.hkspd)h+='<a href="'+esc(b.hkspd)+'" target="_blank">🏠 HKSPD 查詢</a>';
 h+='</div>';
 h+='<b>該大廈全部放盤 ('+ls.length+')：</b>'
  +'<div class="tablewrap" style="max-height:48vh"><table><thead><tr>'
  +'<th>標題</th><th>座數/樓層</th><th>面積(呎)</th><th>售價(萬)</th><th>呎價</th><th>房/浴</th><th>樓齡</th><th>代理</th><th>動態</th><th>詳情</th>'
  +'</tr></thead><tbody>';
 for(var j=0;j<ls.length;j++){
  var o=ls[j],l=o.l;
  h+='<tr'+(l.link?' onclick="openListing('+o.i+')"':'')+'>'
   +'<td>'+esc(l.title||'-')+'</td><td>'+esc(l.floor||'-')+'</td><td>'+fmt(l.area)+'</td>'
   +'<td>'+fmt(l.price)+'</td><td>'+fmt(l.ft_price)+'</td>'
   +'<td>'+esc(l.rooms||'-')+'/'+esc(l.baths||'-')+'</td><td>'+fmt(l.age)+'</td>'
   +'<td>'+esc(l.agent||'-')+'</td>'
   +'<td><span class="tag '+tagClass(l.status)+'">'+esc(l.status||'-')+'</span></td>'
   +'<td>'+(l.link?'<a href="'+esc(l.link)+'" target="_blank" onclick="event.stopPropagation()">🔗 詳情</a>':'-')+'</td></tr>';
 }
 h+='</tbody></table></div></div></div>';
 var host=document.getElementById('modalHost');
 host.innerHTML=h;
 host.className='on';
}
function closeDetail(){var m=document.getElementById('modalHost');m.className='';m.innerHTML='';}
function openListing(li){
 var l=LISTINGS[li];
 if(l&&l.link){window.open(l.link,'_blank');}
}
function showOnMap(bi){
 var b=BUILDINGS[bi];if(!b)return;
 var m=markers[b.name];
 if(!m){alert('此大廈無坐標，無法在地圖顯示');return;}
 var wasNoMap=document.body.classList.contains('nomap');
 closeDetail();
 if(wasNoMap){
  toggleFS();
  setTimeout(function(){map.setView(m.getLatLng(),17);m.openPopup();},400);
 }else{
  map.setView(m.getLatLng(),17);m.openPopup();
 }
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail();});
(function(){var pts=[];for(var k in markers){pts.push(markers[k].getLatLng());}if(pts.length)map.fitBounds(pts,{padding:[30,30]});})();
renderHead();renderTable();
</script>
</body>
