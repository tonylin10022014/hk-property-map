<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>房產地圖分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 85vh; }
        .leaflet-popup-content { font-size: 14px; min-width: 200px; max-height: 250px; overflow-y: auto; }
        .prop-list-item:hover { background-color: #f0f9ff; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4" x-data="mapApp()">
        <h1 class="text-3xl font-bold mb-6 text-center text-indigo-600">房產地圖分析 (Tailwind + Alpine + Leaflet)</h1>
        <div class="flex flex-col md:flex-row gap-6">
            <div class="w-full md:w-3/4 bg-white p-4 rounded-xl shadow-lg">
                <div id="map" class="rounded-lg"></div>
            </div>
            <div class="w-full md:w-1/4 bg-white p-4 rounded-xl shadow-lg max-h-85vh flex flex-col">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">大廈列表</h2>
                <input type="text" placeholder="搜尋屋苑..." class="w-full p-2 mb-4 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" x-model="search">
                
                <div class="flex justify-between font-bold text-gray-600 border-b pb-2 mb-2 text-sm cursor-pointer">
                    <div class="w-1/2" @click="sortBy('building')">屋苑 <span x-show="sortKey==='building'" x-text="sortReverse ? '▼' : '▲'"></span></div>
                    <div class="w-1/4 text-right" @click="sortBy('min_price')">最低價 <span x-show="sortKey==='min_price'" x-text="sortReverse ? '▼' : '▲'"></span></div>
                    <div class="w-1/4 text-right" @click="sortBy('mark')">動態 <span x-show="sortKey==='mark'" x-text="sortReverse ? '▼' : '▲'"></span></div>
                </div>

                <ul class="space-y-2 overflow-y-auto flex-1">
                    <template x-for="p in sortedProperties" :key="p.building">
                        <li class="p-3 border rounded-lg prop-list-item cursor-pointer transition duration-150"
                            @click="map.flyTo([p.lat, p.lon], 18); openPopup(p.building)">
                            <div class="flex justify-between items-center">
                                <div class="font-bold text-indigo-700" x-text="p.building"></div>
                                <div class="text-2xl cursor-pointer" x-text="p.bookmark ? '⭐' : '☆'" @click.stop="toggleBookmark(p)"></div>
                            </div>
                            <div class="text-sm text-gray-600 flex justify-between">
                                <span>最低價: <span x-text="p.min_price"></span>萬</span>
                                <span x-text="p.mark" :class="{'text-red-500': p.mark.includes('新盤'), 'text-blue-500': p.mark.includes('加價'), 'text-green-500': p.mark.includes('減價')}"></span>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
        </div>
    </div>

                p.properties.forEach(prop => {
                    let statusColor = 'text-gray-500';
                    if (prop.mark.includes('新盤')) statusColor = 'text-red-500 font-bold';
                    else if (prop.mark.includes('加價')) statusColor = 'text-blue-500 font-bold';
                    else if (prop.mark.includes('減價')) statusColor = 'text-green-500 font-bold';

                    popupContent += `
                        <div class="mb-2 pb-2 border-b border-gray-100">
                            <div class="text-sm flex justify-between">
                                <span>
                                    <span class="font-semibold text-red-500">${prop.price}萬</span> | 
                                    ${prop.area}呎 | 
                                    ${prop.floor}
                                </span>
                                <span class="${statusColor}">${prop.mark} ${prop.diff}</span>
                            </div>
                            ${prop.link ? `<a href="${prop.link}" target="_blank" class="text-blue-500 text-xs hover:underline">查看詳情</a>` : ''}
                        </div>`;
                });
                
                popupContent += `</div>`;
                
                let markerColor = 'orange';
                if (p.bookmark) markerColor = 'gold';
                else if (p.mark.includes('新盤')) markerColor = 'red';
                else if (p.mark.includes('加價')) markerColor = 'blue';
                else if (p.mark.includes('減價')) markerColor = 'green';

                const marker = L.circleMarker([p.lat, p.lon], {
                    radius: 8,
                    color: markerColor,
                    fillColor: markerColor,
                    fillOpacity: 0.8
                }).addTo(map).bindPopup(popupContent);
                
                markers[p.building] = marker;
            }
        });

        function openPopup(building) {
            if (markers[building]) {
                markers[building].openPopup();
            }
        }
    </script>
</body>
</html>
